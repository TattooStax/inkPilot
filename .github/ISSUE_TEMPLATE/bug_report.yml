name: inkPilot bug report
description: Report an inkPilot behavior with synthetic or redacted data
labels: [bug, "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Share steps and the exact build commit or APK version. Do not post a customer's number, message, photo, model prompt, or call recording.
  - type: input
    id: build
    attributes:
      label: Build or commit
      description: Version code and commit SHA, if available
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and include role, SIM and network state when relevant
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
