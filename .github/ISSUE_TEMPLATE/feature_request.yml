name: inkPilot feature request
description: Suggest a studio workflow improvement
labels: ["feature request", "needs triage"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current studio workflow and problem
      description: Describe the problem without customer data
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
