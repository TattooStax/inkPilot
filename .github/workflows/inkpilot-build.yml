name: inkPilot build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkpilot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify standalone app identity
        run: |
          python3 scripts/verify_app_identity.py
          python3 scripts/verify_inkpilot_release.py --source
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test reusable modules and assemble standalone app
        run: ./gradlew :agent-core:test :transport:test :local-inference:testDebugUnitTest :app:assembleFossDebug --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Check Detekt debt ratchet
        run: |
          rm -f app/build/reports/detekt/detekt.sarif
          ./gradlew :app:detekt --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
          python3 scripts/check-detekt-debt.py --sarif app/build/reports/detekt/detekt.sarif
      - name: Verify packaged SMS role qualification
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(app/build/intermediates/merged_manifests/fossDebug/*/AndroidManifest.xml)
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          test "${#manifests[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - name: Assemble side-by-side OnePlus combined preview
        if: github.ref == 'refs/heads/test/onepluscombined-e915-preview'
        run: ./gradlew :app:assembleFossDebug -PAPP_ID=app.inkpilot.android.onepluscombined --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify side-by-side preview identity and SMS role
        if: github.ref == 'refs/heads/test/onepluscombined-e915-preview'
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(app/build/intermediates/merged_manifests/fossDebug/*/AndroidManifest.xml)
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          test "${#manifests[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
          python3 - "${manifests[0]}" "${apks[0]}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          sys.path.insert(0, "scripts")
          from verify_sms_role_qualification import find_aapt2

          expected = "app.inkpilot.android.onepluscombined.debug"
          merged = ET.parse(sys.argv[1]).getroot().get("package")
          apk = Path(sys.argv[2])
          badging = subprocess.run([find_aapt2(), "dump", "badging", str(apk)],
                                   capture_output=True, text=True, check=True).stdout
          packaged = re.search(r"(?m)^package: name='([^']+)'", badging)
          if merged != expected or packaged is None or packaged.group(1) != expected:
              raise SystemExit("Preview package differs from the isolated install identity")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          proof = {"source_sha": os.environ["GITHUB_SHA"], "package": expected,
                   "apk_sha256": digest, "sms_role_manifest_verified": True,
                   "carrier_delivery_tested": False}
          Path("app/build/outputs/onepluscombined-preview.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          print(f"Preview package {expected}; APK SHA-256 {digest}")
          PY
      - name: Upload side-by-side OnePlus combined preview
        if: github.ref == 'refs/heads/test/onepluscombined-e915-preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-onepluscombined-preview-${{ github.sha }}
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/onepluscombined-preview.json
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-test-reports
          path: |
            agent-core/build/reports/tests/
            transport/build/reports/tests/
            local-inference/build/reports/tests/
          if-no-files-found: ignore
