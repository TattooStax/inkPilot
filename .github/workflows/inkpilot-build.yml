name: inkPilot build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkpilot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify standalone app identity
        run: |
          python3 scripts/verify_app_identity.py
          python3 scripts/verify_inkpilot_release.py --source
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test reusable modules and assemble standalone app
        run: ./gradlew :agent-core:test :transport:test :local-inference:testDebugUnitTest :app:assembleFossDebug --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Check Detekt debt ratchet
        run: |
          rm -f app/build/reports/detekt/detekt.sarif
          ./gradlew :app:detekt --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
          python3 scripts/check-detekt-debt.py --sarif app/build/reports/detekt/detekt.sarif
      - name: Verify packaged SMS role qualification
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(app/build/intermediates/merged_manifests/fossDebug/*/AndroidManifest.xml)
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          test "${#manifests[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - name: Assemble side-by-side OnePlus preview
        run: ./gradlew :app:assembleFossDebug -PAPP_ID=app.inkpilot.android.oneplus --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify preview package and SMS role surface
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(app/build/intermediates/merged_manifests/fossDebug/*/AndroidManifest.xml)
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          test "${#manifests[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          python3 - "${manifests[0]}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          package = ET.parse(sys.argv[1]).getroot().get("package")
          if package != "app.inkpilot.android.oneplus.debug":
              raise SystemExit("Unexpected side-by-side preview package: " + str(package))
          PY
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-oneplus-preview-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-test-reports
          path: |
            agent-core/build/reports/tests/
            transport/build/reports/tests/
            local-inference/build/reports/tests/
          if-no-files-found: ignore
