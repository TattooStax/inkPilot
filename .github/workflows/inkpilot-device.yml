name: inkPilot device proof

on:
  push:
    paths:
      - 'app/**'
      - 'agent-core/**'
      - 'transport/**'
      - 'local-inference/**'
      - 'gradle/**'
      - '*gradle*'
      - 'scripts/inkpilot-device-*'
      - 'scripts/run-inkpilot-test-class.sh'
      - 'scripts/test-run-inkpilot-test-class.py'
      - '.github/workflows/inkpilot-device.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkpilot-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-baseline:
    # Independent of the model download and long inference proof below.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-class runner contract without a device
        run: python3 scripts/test-run-inkpilot-test-class.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build model-free baseline APKs
        run: >-
          ./gradlew :app:assembleFossDebug :app:assembleFossDebugAndroidTest
          --console=plain --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx3g -PinkpilotAbi=x86_64
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: First-launch preservation then inherited UI baseline
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            shopt -s nullglob; apks=(app/build/outputs/apk/foss/debug/*.apk); test "${#apks[@]}" -eq 1; adb -s emulator-5554 install -r "${apks[0]}"
            adb -s emulator-5554 shell cmd role add-role-holder --user 0 android.app.role.SMS app.inkpilot.android.debug
            for permission in READ_SMS SEND_SMS RECEIVE_SMS READ_CONTACTS READ_PHONE_STATE POST_NOTIFICATIONS; do adb -s emulator-5554 shell pm grant app.inkpilot.android.debug "android.permission.$permission"; done
            scripts/run-inkpilot-test-class.sh emulator-5554 org.fossify.messages.inkpilot.data.LegacyFirstLaunchTest
            scripts/run-inkpilot-test-class.sh emulator-5554 org.fossify.messages.inkpilot.smoke.ShellBaselineTest
      - name: Upload redacted baseline verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkPilot-shell-baseline
          path: app/build/test-class-evidence/
          if-no-files-found: warn
  local-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted runner toolchains
        if: runner.environment == 'github-hosted'
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]]; then exit 0; fi
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore exact native emulator build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: local-inference/.cxx
          key: native-${{ runner.os }}-x86_64-${{ hashFiles('local-inference/src/main/cpp/**', 'local-inference/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**', '.github/workflows/inkpilot-device.yml') }}
      - name: Build app and device tests before starting emulator
        run: >-
          ./gradlew :app:assembleFossDebug :app:assembleFossDebugAndroidTest
          --console=plain --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx3g -PinkpilotAbi=x86_64
      - name: Save successful native emulator build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: local-inference/.cxx
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Download checksum-pinned local model
        run: scripts/inkpilot-device-model.sh "$RUNNER_TEMP/inkpilot-model.gguf"
      - name: Verify emulator disk budget
        run: |
          mkdir -p app/build/device-test-evidence
          df -h "$GITHUB_WORKSPACE" | tee app/build/device-test-evidence/runner-disk.txt
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( available < 10 * 1024 * 1024 * 1024 )); then
            echo 'At least 10 GiB must remain for the system image, 4 GiB AVD, and runtime files.' >&2
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real local SMS draft loop on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: scripts/inkpilot-device-run.sh "$RUNNER_TEMP/inkpilot-model.gguf"
      - name: Upload device proof and test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkPilot-device-proof
          path: |
            app/build/device-test-evidence/
            app/build/outputs/apk/androidTest/foss/debug/*.apk
          if-no-files-found: warn