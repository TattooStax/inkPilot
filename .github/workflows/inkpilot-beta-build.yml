name: inkPilot signed canonical beta build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: inkpilot-beta-signing
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify standalone source and tests
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test ! -e keystore.properties
          test "$(wc -l < docs/BETA-SIGNING-CERT.sha256)" -eq 1
          pinned_cert=$(cat docs/BETA-SIGNING-CERT.sha256)
          [[ "$pinned_cert" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/verify_app_identity.py
          python3 scripts/verify_inkpilot_release.py --source
          python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint, and build signed canonical APK
        shell: bash
        env:
          INKPILOT_BETA_KEYSTORE_BASE64: ${{ secrets.INKPILOT_BETA_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.INKPILOT_BETA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.INKPILOT_BETA_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.INKPILOT_BETA_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/inkpilot-beta-keystore.jks
        run: |
          set -euo pipefail
          : "${INKPILOT_BETA_KEYSTORE_BASE64:?Missing beta signing secret}"
          : "${SIGNING_KEY_ALIAS:?Missing beta key alias}"
          : "${SIGNING_KEY_PASSWORD:?Missing beta key password}"
          : "${SIGNING_STORE_PASSWORD:?Missing beta store password}"
          test ! -e keystore.properties
          umask 077
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          printf '%s' "$INKPILOT_BETA_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"
          ./gradlew :agent-core:test :transport:test :local-inference:testDebugUnitTest \
            :app:testFossDebugUnitTest :app:lintFossRelease :app:assembleFossRelease \
            --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Check Detekt debt ratchet
        run: |
          rm -f app/build/reports/detekt/detekt.sarif
          ./gradlew :app:detekt --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
          python3 scripts/check-detekt-debt.py --sarif app/build/reports/detekt/detekt.sarif
      - name: Verify signed canonical identity and SMS role
        shell: bash
        env:
          INKPILOT_BETA_CERT_SHA256: ${{ secrets.INKPILOT_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${INKPILOT_BETA_CERT_SHA256:?Missing pinned beta certificate digest}"
          test "$(wc -l < docs/BETA-SIGNING-CERT.sha256)" -eq 1
          pinned_cert=$(cat docs/BETA-SIGNING-CERT.sha256)
          [[ "$pinned_cert" =~ ^[0-9a-f]{64}$ ]]
          test "$pinned_cert" = "${INKPILOT_BETA_CERT_SHA256,,}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/foss/release/*.apk)
          manifests=(app/build/intermediates/merged_manifests/fossRelease/*/AndroidManifest.xml)
          test "${#apks[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          mapfile -t signers < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner -executable | sort -V)
          mapfile -t inspectors < <(find "$ANDROID_HOME/build-tools" -type f -name aapt -executable | sort -V)
          test "${#signers[@]}" -gt 0
          test "${#inspectors[@]}" -gt 0
          python3 - "${apks[0]}" "$pinned_cert" "${signers[-1]}" "${inspectors[-1]}" <<'PY'
          import re
          import sys
          from pathlib import Path
          from scripts.verify_inkpilot_release import inspect_signed_apk

          digest = sys.argv[2]
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Invalid pinned beta certificate digest")
          failures = inspect_signed_apk(Path(sys.argv[1]), "app.inkpilot.android", digest,
                                        Path(sys.argv[3]), Path(sys.argv[4]))
          if failures:
              raise SystemExit("; ".join(failures))
          PY
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
      - name: Upload exact signed canonical candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-foss-release-beta
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
