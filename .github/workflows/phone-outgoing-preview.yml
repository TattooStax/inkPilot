name: inkPilot Phone outgoing preview

on:
  push:
    branches: [test/phone-outgoing-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkpilot-phone-outgoing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/test/phone-outgoing-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Verify canonical source and file ratchet
        run: |
          test "$(git rev-parse HEAD^)" = a39bcf7dd5c2ca41f9e1e0acc62b28e4fefe97bb
          git diff --name-only HEAD^ HEAD | sort > /tmp/preview-delta
          printf '%s\n' .github/workflows/phone-outgoing-preview.yml | diff -u - /tmp/preview-delta
          python3 scripts/verify_app_identity.py
          python3 scripts/verify_inkpilot_release.py --source
          scripts/check-file-size-ratchet.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Assemble side-by-side Phone outgoing preview
        run: ./gradlew :app:assembleFossDebug -PAPP_ID=app.inkpilot.android.phonecandidate --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify preview package and SMS role
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(app/build/intermediates/merged_manifests/fossDebug/*/AndroidManifest.xml)
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          test "${#manifests[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_sms_role_qualification.py "${manifests[0]}" "${apks[0]}"
          python3 - "${manifests[0]}" "${apks[0]}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          sys.path.insert(0, "scripts")
          from verify_sms_role_qualification import find_aapt2

          expected = "app.inkpilot.android.phonecandidate.debug"
          merged = ET.parse(sys.argv[1]).getroot().get("package")
          apk = Path(sys.argv[2])
          badging = subprocess.run([find_aapt2(), "dump", "badging", str(apk)],
                                   capture_output=True, text=True, check=True).stdout
          packaged = re.search(r"(?m)^package: name='([^']+)'", badging)
          if merged != expected or packaged is None or packaged.group(1) != expected:
              raise SystemExit("Preview package differs from the isolated install identity")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          proof = {"source_sha": os.environ["GITHUB_SHA"], "phone_source_sha": "a39bcf7dd5c2ca41f9e1e0acc62b28e4fefe97bb", "package": expected,
                   "apk_sha256": digest, "sms_role_manifest_verified": True,
                   "carrier_delivery_tested": False}
          Path("app/build/outputs/phone-outgoing-preview.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          print(f"Preview package {expected}; APK SHA-256 {digest}")
          PY
      - name: Upload side-by-side preview APK and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkPilot-phone-outgoing-preview-${{ github.sha }}
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/phone-outgoing-preview.json
          if-no-files-found: error
