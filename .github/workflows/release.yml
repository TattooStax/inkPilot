name: inkPilot internal text beta qualification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful manual inkPilot build run; install its exact debug APK on the test phone
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check standalone identity and beta source
        run: |
          python3 scripts/verify_app_identity.py
          python3 scripts/verify_inkpilot_release.py --source
          python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint, and assemble unsigned minified source check
        run: >-
          ./gradlew :agent-core:test :transport:test :local-inference:testDebugUnitTest
          :app:testFossDebugUnitTest :app:lintFossRelease :app:assembleFossRelease
          --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify exact successful manual build and evidence-only changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/inkpilot-candidate-run.json"
          head_sha=$(python3 scripts/check_candidate_run.py "$RUNNER_TEMP/inkpilot-candidate-run.json" docs/RELEASE-EVIDENCE.json "$GITHUB_REPOSITORY" "$CANDIDATE_RUN_ID")
          git cat-file -e "$head_sha^{commit}"
          git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA"
          while IFS= read -r changed; do
            case "$changed" in
              docs/RELEASE-EVIDENCE.json|docs/release-evidence/*) ;;
              *) echo "Source changed after physical candidate: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$head_sha" "$GITHUB_SHA")
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inkPilot-foss-debug
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Require signed installed APK and reviewed internal beta evidence
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          mapfile -t apks < <(find candidate -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          mapfile -t signers < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner -executable | sort -V)
          mapfile -t inspectors < <(find "$ANDROID_HOME/build-tools" -type f -name aapt -executable | sort -V)
          test "${#signers[@]}" -gt 0
          test "${#inspectors[@]}" -gt 0
          python3 scripts/verify_inkpilot_release.py --beta --apk "${apks[0]}" --apksigner "${signers[-1]}" --aapt "${inspectors[-1]}" --candidate-run-id "$CANDIDATE_RUN_ID"
